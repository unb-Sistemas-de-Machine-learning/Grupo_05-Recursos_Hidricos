<!-- Perfil (partial) -->
<section id="profile-root" class="w-full" data-page-profile>
  <div class="min-h-[calc(100vh-0px)] flex items-center justify-center px-6 py-10">
    <div class="w-full max-w-4xl rounded-3xl bg-white/80 dark:bg-white/5 backdrop-blur
                border border-black/5 dark:border-white/10 shadow-sm p-6 sm:p-8">
      <header class="text-center mb-8">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-[#031E21] dark:text-white" data-i18n="Profile.heading">Meu perfil</h1>
        <p class="mt-1 text-sm text-gray-600 dark:text-gray-300" data-i18n="Profile.subheading">Atualize suas informações pessoais e preferências.</p>
      </header>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-8 items-center">
        <div class="md:col-span-1">
          <div class="flex flex-col items-center gap-4">
            <div class="relative">
              <img id="pf-avatar-preview" src="/src/assets/img/avatar-default.png" alt="Avatar"
                   class="h-32 w-32 rounded-2xl object-cover ring-2 ring-[#0A5C67]/20 dark:ring-white/10">
              <label for="pf-avatar"
                     class="absolute -bottom-2 -right-2 cursor-pointer rounded-xl bg-[#0A5C67] px-3 py-1.5 text-white text-xs font-semibold shadow hover:brightness-110"
                     data-i18n="Profile.avatar.change">Trocar</label>
              <input id="pf-avatar" type="file" class="hidden" accept="image/*" />
            </div>
            <div class="flex items-center gap-3">
              <button id="pf-avatar-remove" class="text-xs text-gray-600 dark:text-gray-300 hover:underline" type="button" data-i18n="Profile.avatar.remove">Remover foto</button>
              <button type="button" data-pf-avatar-tone class="text-xs text-[#0A5C67] hover:underline">Escolher tom de avatar</button>
            </div>
          </div>
        </div>

        <form class="md:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4" novalidate>
          <div>
            <label class="pf-label" for="pf-name" data-i18n="Profile.field.name">Nome</label>
            <input id="pf-name" type="text" autocomplete="name" class="pf-input" placeholder="Seu nome" data-i18n-placeholder="Profile.placeholder.name">
          </div>
          <div>
            <label class="pf-label" for="pf-email" data-i18n="Profile.field.email">E-mail</label>
            <input id="pf-email" type="email" autocomplete="email" class="pf-input" placeholder="voce@exemplo.com" data-i18n-placeholder="Profile.placeholder.email">
          </div>
          <div>
            <label class="pf-label" for="pf-org" data-i18n="Profile.field.org">Organização</label>
            <input id="pf-org" type="text" autocomplete="organization" class="pf-input" placeholder="Instituição/Empresa" data-i18n-placeholder="Profile.placeholder.org">
          </div>
          <div>
            <label class="pf-label" for="pf-role" data-i18n="Profile.field.role">Função</label>
            <select id="pf-role" class="pf-input">
              <option value="pesquisador">Pesquisador(a)</option>
              <option value="engenheiro">Engenheiro(a)</option>
              <option value="tecnico">Técnico(a)</option>
              <option value="gestor">Gestor(a)</option>
              <option value="estudante">Estudante</option>
              <option value="outro">Outro</option>
            </select>
            <input id="pf-role-other" type="text" class="pf-input mt-2 hidden" placeholder="Descreva sua função" />
          </div>
          <div>
            <label class="pf-label" for="pf-phone" data-i18n="Profile.field.phone">Telefone</label>
            <input id="pf-phone" type="text" autocomplete="tel" class="pf-input" placeholder="(61) 9 9999-9999" data-i18n-placeholder="Profile.placeholder.phone">
          </div>
          <div>
            <label class="pf-label" for="pf-lang" data-i18n="Profile.field.lang">Idioma</label>
            <select id="pf-lang" class="pf-input">
              <option value="pt-BR" data-i18n="Common.lang.ptbr">Português (BR)</option>
              <option value="en" data-i18n="Common.lang.en">English</option>
              <option value="es" data-i18n="Common.lang.es">Español</option>
            </select>
          </div>
          <div class="sm:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4">
            <label class="inline-flex items-center gap-2"><input id="pf-dark" type="checkbox" class="rounded text-[#0A5C67]"><span class="text-sm" data-i18n="Profile.field.dark">Usar modo escuro</span></label>
            <label class="inline-flex items-center gap-2"><input id="pf-alerts" type="checkbox" class="rounded text-[#0A5C67]"><span class="text-sm" data-i18n="Profile.field.alerts">Receber alertas por e-mail</span></label>
          </div>
          <div class="sm:col-span-2 grid grid-cols-1 sm:grid-cols-3 gap-4 mt-2">
            <div><label class="pf-label" for="pf-pass-current" data-i18n="Profile.field.pass_current">Senha atual</label><input id="pf-pass-current" type="password" autocomplete="current-password" class="pf-input" placeholder="••••••••"></div>
            <div><label class="pf-label" for="pf-pass-new" data-i18n="Profile.field.pass_new">Nova senha</label><input id="pf-pass-new" type="password" autocomplete="new-password" class="pf-input" placeholder="mín. 8 caracteres" data-i18n-placeholder="Profile.placeholder.pass_new"></div>
            <div><label class="pf-label" for="pf-pass-confirm" data-i18n="Profile.field.pass_confirm">Confirmar senha</label><input id="pf-pass-confirm" type="password" autocomplete="new-password" class="pf-input" placeholder="repita a nova senha" data-i18n-placeholder="Profile.placeholder.pass_confirm"></div>
          </div>
        </form>
      </div>

      <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
        <button id="pf-save" class="btn-aguaprev" data-i18n="Profile.actions.save">Salvar alterações</button>
        <button id="pf-reset" class="btn-aguaprev-outline" data-i18n="Profile.actions.reset">Descartar</button>
        <span id="pf-status" class="sr-only" aria-live="polite"></span>
      </div>

      <div class="mt-8 border-t border-black/5 dark:border-white/10 pt-6">
        <h2 class="text-base font-semibold text-[#031E21] dark:text-white mb-2" data-i18n="Profile.activity.title">Atividade recente</h2>
        <ul id="pf-activity" class="text-sm text-gray-600 dark:text-gray-300 space-y-1"></ul>
      </div>
    </div>
  </div>
</section>
