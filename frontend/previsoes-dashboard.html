<!doctype html>
<html lang="pt-br" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Previsões — AguaPrev</title>
    <meta name="theme-color" content="#0A5C67" />
    <link rel="icon" type="image/png" href="/home/logo.png" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  </head>

  <body class="font-sans antialiased bg-white text-gray-800 dark:bg-[#0E1A2B] dark:text-gray-100">
    <!-- Sidebar montada pelo main.js -->
    <div id="app-sidebar-root"></div>

    <!-- Conteúdo Principal -->
    <main id="ap-content" class="relative">
      <div class="max-w-[1440px] mx-auto px-5 sm:px-6 lg:px-10 py-8">
        
        <!-- Header -->
        <header class="mb-6">
          <h1
            class="text-2xl sm:text-3xl font-extrabold tracking-tight text-[#031E21] dark:text-white"
          >
            Previsões de Nível de Água
          </h1>
          <p
            class="mt-1 text-sm text-gray-600 dark:text-gray-300"
          >
            Análise de previsões de cota hídrica mediante modelos de machine learning.
          </p>
        </header>

        <!-- Filtro de Período -->
        <section
          class="rounded-3xl ring-1 ring-black/5 dark:ring-white/10 bg-white/70 dark:bg-white/5 backdrop-blur p-4 sm:p-5 mb-6"
        >
          <form
            id="prev-filters-form"
            class="space-y-4"
          >
            <!-- Inputs de Período -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <!-- Data Inicial -->
              <div>
                <label
                  for="f-data-inicial"
                  class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-2"
                >
                  Data Inicial
                </label>
                <input
                  type="datetime-local"
                  id="f-data-inicial"
                  class="w-full rounded-xl border border-black/10 dark:border-white/10 bg-white dark:bg-white/10
                             text-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#0A5C67]"
                />
              </div>

              <!-- Data Final -->
              <div>
                <label
                  for="f-data-final"
                  class="block text-xs font-semibold text-gray-600 dark:text-gray-300 mb-2"
                >
                  Data Final
                </label>
                <input
                  type="datetime-local"
                  id="f-data-final"
                  class="w-full rounded-xl border border-black/10 dark:border-white/10 bg-white dark:bg-white/10
                             text-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#0A5C67]"
                />
              </div>
            </div>

            <!-- Preset Buttons -->
            <div class="flex gap-2 flex-wrap">
              <button
                type="button"
                id="preset-24h"
                class="px-4 py-2 bg-[#0A5C67] hover:bg-[#084550] text-white rounded-xl text-sm font-semibold transition"
              >
                Últimas 24h
              </button>
              <button
                type="button"
                id="preset-7d"
                class="px-4 py-2 bg-[#0A5C67] hover:bg-[#084550] text-white rounded-xl text-sm font-semibold transition"
              >
                Últimos 7 dias
              </button>
              <button
                type="button"
                id="preset-30d"
                class="px-4 py-2 bg-[#0A5C67] hover:bg-[#084550] text-white rounded-xl text-sm font-semibold transition"
              >
                Últimos 30 dias
              </button>
              <button
                type="button"
                id="preset-90d"
                class="px-4 py-2 bg-[#0A5C67] hover:bg-[#084550] text-white rounded-xl text-sm font-semibold transition"
              >
                Últimos 90 dias
              </button>
            </div>
          </form>
        </section>

        <!-- Gráfico Principal -->
        <section class="mb-6">
          <article
            class="rounded-3xl ring-1 ring-black/5 dark:ring-white/10 bg-white/70 dark:bg-white/5 backdrop-blur p-5"
          >
            <h2 class="font-semibold mb-4 text-lg">Evolução da Cota Hídrica</h2>
            <div id="chart-loading" class="text-center text-gray-500">Carregando dados...</div>
            <canvas
              id="ch-historico"
              height="300"
              aria-label="Gráfico histórico de cota hídrica"
            ></canvas>
          </article>
        </section>

        <!-- Tabela de Dados Brutos -->
        <section class="mb-6">
          <article
            class="rounded-3xl ring-1 ring-black/5 dark:ring-white/10 bg-white/70 dark:bg-white/5 backdrop-blur p-5"
          >
            <h2 class="font-semibold mb-4">Dados do Período</h2>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="border-b border-black/10 dark:border-white/10">
                  <tr>
                    <th class="text-left py-2 px-3 font-semibold">Data/Hora</th>
                    <th class="text-left py-2 px-3 font-semibold">Cota Adotada (m)</th>
                    <th class="text-left py-2 px-3 font-semibold">Chuva (mm)</th>
                    <th class="text-left py-2 px-3 font-semibold">Vazão (m³/s)</th>
                    <th class="text-left py-2 px-3 font-semibold">Estação</th>
                  </tr>
                </thead>
                <tbody id="prev-table-body" class="divide-y divide-black/5 dark:divide-white/5">
                  <!-- Linhas serão preenchidas via JavaScript -->
                </tbody>
              </table>
            </div>
          </article>
        </section>

      </div>
    </main>

    <script type="module">
      import { initPrevisoes } from '/src/js/template/dashboard/previsoes.effects.js';
      import { initCharts } from '/src/js/template/dashboard/previsoes-charts.js';

      document.addEventListener('DOMContentLoaded', async () => {
        // Inicializa gerenciador de previsões
        const previosState = await initPrevisoes(document);

        // Inicializa gráficos
        await initCharts(document, previosState.manager);
      });
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
